name: Linux AppImage Build

on:
  # Nightly builds – triggered by the schedule workflow
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Run nightly prerelease'
        required: false
        default: 'false'
  # Release builds – run on tag pushes to main
  push:
    tags:
      - 'v*'          # any tag that starts with “v”
permissions:
  contents: write

env:
  APPIMAGE_EXTRACT_AND_RUN: '1'   # no FUSE needed for appimagetool or tests

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: debian:bookworm-slim
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential gfortran git \
                             libgtk-3-dev libplplot-dev plplot-driver-cairo \
                             liblapack-dev \
                             gnome-themes-extra adwaita-icon-theme \
                             python3-pip python3.11-venv \
                             wget xvfb

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Mark workspace as safe
        shell: bash
        run: git config --global --add safe.directory "$(pwd)"

      - name: Setup python3
        shell: bash
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r docs/requirements.txt

      - name: Install AppImage tooling
        run: |
          wget -O appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Build & install
        shell: bash
        run: |
          source venv/bin/activate
          ./create_appimage.sh

      - name: Generate AppImage
        run: |
          ARCH=x86_64 appimagetool build/AppDir
          if [ "${{ github.ref_type }}" = "tag" ]; then
            mv UncertRadio-*.AppImage "UncertRadio_${{ github.ref_name }}_x86_64.AppImage"
          else
            mv UncertRadio-*.AppImage "UncertRadio_nightly_$(date +%F)_x86_64.AppImage"
          fi

      - name: Smoke test AppImage
        run: |
          APP=$(ls UncertRadio_*.AppImage)
          xvfb-run -a "./$APP" --appimage-extract-and-run run_tests > run_tests.log 2>&1
          grep "BA-Test finished: no deviations!" run_tests.log
          grep "STOP 0" run_tests.log

      - name: Nightly Release
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.nightly == 'true' }}
        with:
          prerelease: true
          name: Nightly_${{ github.ref_name }}
          tag_name: Nightly_${{ github.ref_name }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            UncertRadio_nightly_*.AppImage

      - name: Tag Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          generate_release_notes: true
          name: Release_${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            UncertRadio_${{ github.ref_name }}_x86_64.AppImage
